services:
  app:
    image: ghcr.io/${GHCR_OWNER:-your-org}/otc-oidc:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    volumes:
      - data:/app/data
      - ./clients.json:/app/clients.json:ro
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    profiles: [proxy]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  data:
  caddy_data:
  caddy_config:
